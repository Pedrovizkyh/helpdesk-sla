services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: helpdesk-postgres
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
      POSTGRES_DB: helpdesk
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk"]
      interval: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: helpdesk-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: helpdesk-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
